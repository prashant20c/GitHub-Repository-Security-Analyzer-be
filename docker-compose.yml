services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: security_analyzer_app
    working_dir: /var/www/backend
    volumes:
      - ./:/var/www/backend
    environment:
      APP_ENV: local
      RUN_MIGRATIONS: "true"
    depends_on:
      - mysql

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: security_analyzer_queue
    working_dir: /var/www/backend
    command: php artisan queue:work --tries=3 --timeout=900
    volumes:
      - ./:/var/www/backend
    depends_on:
      - app
      - mysql

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: security_analyzer_scheduler
    working_dir: /var/www/backend
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - ./:/var/www/backend
    depends_on:
      - app
      - mysql

  nginx:
    image: nginx:1.27-alpine
    container_name: security_analyzer_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: security_analyzer_mysql
    environment:
      MYSQL_DATABASE: security_analyzer
      MYSQL_USER: security_analyzer
      MYSQL_PASSWORD: security_analyzer
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  frontend:
    image: node:20-alpine
    container_name: security_analyzer_frontend
    working_dir: /var/www/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/var/www/frontend
    ports:
      - "5173:5173"

volumes:
  mysql-data:
